plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    compileSdk 34
    namespace 'my.torrstream.server'

    defaultConfig {
        applicationId "my.torrstream.server"
        // 24: Node из Termux собран под API 24
        minSdkVersion 24
        // 28, не выше: сервер, ffmpeg и TorrServer — исполняемые файлы, и TorrServer
        // скачивается в память приложения. Запускать такие файлы приложению с
        // targetSdk 29+ Android 10 запрещает (W^X).
        //noinspection ExpiredTargetSdkVersion
        targetSdkVersion 28
        versionCode 6
        versionName "0.5.1"
    }

    // Подпись release-сборки — ключом из секретов CI (.github/workflows/build.yml):
    // файл ключа и пароли приходят переменными окружения. Без них release-APK
    // собирается неподписанным, а для проверки на устройстве есть debug
    def ksFile = System.getenv('KEYSTORE_FILE')
    signingConfigs {
        release {
            if (ksFile) {
                storeFile file(ksFile)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (ksFile) signingConfig signingConfigs.release
        }
    }

    // targetSdk 28 lint считает ошибкой и рубит release — а он нужен намеренно
    // (запуск скачанного TorrServer, см. defaultConfig)
    lint {
        checkReleaseBuilds false
    }

    // Отдельный APK на архитектуру: в каждом свои сервер (Node) и ffmpeg, по ~200 МБ
    // распакованных — общий APK весил бы вдвое больше
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a', 'x86_64'
            universalApk false
        }
    }

    packagingOptions {
        jniLibs {
            // Бинарники лежат в jniLibs как lib*.so: система распаковывает их в
            // nativeLibraryDir, откуда разрешён запуск. Без legacy-упаковки они
            // остались бы внутри APK, и запускать было бы нечего
            useLegacyPackaging true
            // Это не библиотеки, а статические программы — strip им не нужен
            keepDebugSymbols += ['**/*.so']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
